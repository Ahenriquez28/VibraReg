version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: vibra_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vibra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  registration-service:
    build: ./RegistrationService  # ✅ Correct
    container_name: registration_service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - R2__AccessKeyId=${R2_ACCESS_KEY_ID}
      - R2__SecretAccessKey=${R2_SECRET_ACCESS_KEY}
      - R2__BucketName=${R2_BUCKET_NAME}
      - R2__AccountId=${R2_ACCOUNT_ID}
      - R2__PublicUrl=${R2_PUBLIC_URL}

      - Email__FromEmail=${EMAIL_FROM}
      - Email__FromName=Vibra Hackathon
      - Email__SmtpServer=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__SmtpUsername=${EMAIL_USERNAME}
      - Email__SmtpPassword=${EMAIL_PASSWORD}
      - Email__FrontendUrl=${FRONTEND_URL}
      - Email__ResendApiKey=${EMAIL_RESEND_API_KEY}
      - TZ=America/New_York
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vibra_network

  auth-service:  
    build: ./JwtAuthApi  
    container_name: auth_service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5089
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JWT__Secret=${JWT_SECRET}
      - JWT__Issuer=VibraAdmin
      - JWT__Audience=VibraAdmin
    ports:
      - "5089:5089"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vibra_network

  api-gateway:
    build: ./VibraApiGateway 
    container_name: api_gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5222
      - RegistrationService__BaseUrl=http://registration-service:5001
      - AdminService__BaseUrl=http://auth-service:5089
    ports:
      - "5222:5222"
    depends_on:
      - registration-service
      - auth-service
    networks:
      - vibra_network

  frontend:
    build:
      context: ./vibra_atl
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://vibraatl.com/api
    container_name: vibra_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api-gateway
    networks:
      - vibra_network

volumes:
  postgres_data:

networks:
  vibra_network:
    driver: bridge
